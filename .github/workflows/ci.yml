name: Verify portable app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run audit:release
      - name: Build container and smoke-test isolated startup
        run: |
          docker build -t meetly:test .
          docker run -d --name meetly-test -p 127.0.0.1:3000:3000 \
            -e APP_URL=http://localhost:3000 \
            -e HOST_NAME='CI Host' -e HOST_EMAIL=host@example.com \
            -e ADMIN_PASSWORD=ci-test-password-never-deploy \
            -e TOKEN_ENCRYPTION_KEY=$(printf '01%.0s' {1..32}) meetly:test
          trap 'docker rm -fv meetly-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/admin/config)" = 401
